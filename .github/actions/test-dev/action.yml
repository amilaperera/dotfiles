name: Test make dev and config in container
description: Build a distro's Docker image, run make dev, then smoke-test config linking
inputs:
  distro:
    description: Short distro name matching a tests/Dockerfile (alma, debian, fedora, ubuntu)
    required: true
runs:
  using: composite
  steps:
    - name: Build image and run make dev
      shell: bash
      env:
        DISTRO: ${{ inputs.distro }}
      run: ./tests/docker.sh dev "$DISTRO"

    - name: Run config smoke test
      shell: bash
      env:
        DISTRO: ${{ inputs.distro }}
      run: ./tests/docker.sh config "$DISTRO"
